[colors]
background = #000000
background-alt = #373B41
foreground = #ffffff
primary = #9dbfcc
secondary = #8ABEB7
alert = #A54242
disabled = #707880
red = #b82c2c

[bar/main]
width = 100%
height = 24pt
radius = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = 
separator-foreground = ${colors.disabled}

; font-0 = monospace;2
font-0 = "DepartureMono Nerd Font:size=13"
font-1 = "Symbols Nerd Font:size=13"

modules-left = xworkspaces
modules-right =  pulseaudio memory cpu temperature network-display battery date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
;label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "Vol "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%
format-margin-right = 0px


[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 80

format = <ramp> <label>
format-warn = <ramp> <label-warn>

label = %temperature-c%
label-foreground = ${colors.foreground}
label-warn = HIGH TEMP! %temperature-c%
label-warn-foreground = ${colors.primary}
format-margin-left = 0px

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-foreground = ${colors.foreground-alt}

;[module/gpu]
;type = custom/script
;exec = ~/Desktop/dotfiles/polybar/scripts/gpu_status.sh
;interval = 2
;label = %output%

[module/gpu]
type = internal/gpu
interval = 2
format-prefix = "GPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%
format-margin-right = 0px

[module/battery]
type = internal/battery
battery = BAT1
adapter = AC
poll-interval = 5

format-charging = <animation-charging> <label-charging>
label-charging = 󱊦 %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = 󱊣 %percentage%%

format-full = <ramp-capacity> <label-full>
label-full = 󰁹 Full

; Icons for charge level while discharging
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

; Animated icon while charging (cycles through these)
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-framerate = 500

; Optional: color-code low battery
label-discharging-foreground = ${colors.foreground}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#9dbfcc}%ifname%%{F-} %essid% 
; %localip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} 

[module/network-display]
type = custom/script
exec = ~/Desktop/dotfiles/polybar/scripts/network_status.sh
interval = 2

[module/network-speed]
type = custom/script
exec = ~/.config/polybar/scripts/network_speed.sh
interval = 1

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.foreground}

[module/powermenu]
type = custom/menu

expand-right = true

format-spacing = 1

label-open = ""
label-open-foreground = ${colors.red}
label-close = 
label-close-foreground = ${colors.success}
label-separator = " "
label-separator-foreground = ${colors.foreground}

;Powermenu
menu-0-0 = "󰤂 Shutdown "
menu-0-0-exec = menu-open-1
menu-0-0-foreground = ${colors.urgent}

; Reboot
menu-0-1 = "󰜉 Reboot "
menu-0-1-exec = menu-open-2
menu-0-1-foreground = ${colors.urgent}

menu-0-2 = "󰤄 Suspend "
menu-0-2-exec = menu-open-3
menu-0-2-foreground = ${colors.warning}

;Reboot
menu-2-0 = "Cancel"
menu-2-0-exec = menu-open-0
menu-2-0-foreground = ${colors.success}
menu-2-1 = "󰜉 Reboot"
menu-2-1-exec = systemctl reboot
menu-2-1-foreground = ${colors.urgent}

;Shutdown
menu-1-0 = "󰤂 Shutdown"
menu-1-0-exec = systemctl poweroff
menu-1-0-foreground = ${colors.urgent}
menu-1-1 = "Cancel "
menu-1-1-exec = menu-open-0
menu-1-1-foreground = ${colors.success}

;Hibernate
menu-3-0 = "󰤄 Sleep "
menu-3-0-exec = systemctl hibernate
menu-3-0-foreground = ${colors.urgent}
menu-3-1 = "Cancel"
menu-3-1-exec = menu-open-0
menu-3-1-foreground = ${colors.success}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

