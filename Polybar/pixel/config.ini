;==========================================================
;
;   Polybar/pixel: pixel-art bar with pop-out menus
;
;   Popups (scripts/pixelpop.py) drop out from under the bar:
;     workspaces -> right-click: overview  (Alt+Tab: switcher, see i3 config)
;     clock     -> calendar
;     cpu / ram -> system info (usage bars)
;     network   -> network switcher
;     volume    -> volume slider + outputs
;     battery   -> power & battery info + power mode switcher
;     power btn -> session menu
;
;   Colors come from the current theme (~/Desktop/dotfiles/Scripts/theme.py):
;   edit ~/Desktop/dotfiles/themes/*.theme, not the [colors] here.
;
;==========================================================

; [colors]: background, background-alt, border, foreground, primary, alert, warn, disabled
include-file = ~/Desktop/dotfiles/themes/current/polybar.ini

[bar/pixel]
bottom = false
; gaps: 8px sides like the i3 windows (gaps inner 4 + gaps outer 4), slightly less on top
width = 100%:-16
offset-x = 8
offset-y = 6
; i3 would force a docked bar to full width, so the bar places itself;
; i3 reserves the space with `gaps top 46` (6 gap + 36 bar + 4 outer) in the i3 config
override-redirect = true
wm-restack = i3
height = 32
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2

; 2px pixel border, same width as the i3 window borders; popups hang from it
border-size = 2
border-color = ${colors.border}

padding-left = 0
padding-right = 1

module-margin = 1

separator = │
separator-foreground = ${colors.border}

; Terminus is a bitmap (pixel) font: crisp at its native sizes
font-0 = "Terminus:pixelsize=18;4"
font-1 = "Symbols Nerd Font:pixelsize=16;4"

modules-left = workspaces
modules-right = cpu memory network pulseaudio battery date session

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; ---------- workspaces (interactive) ----------
; app icons per workspace; click = switch, scroll = cycle, right-click = overview
; also keeps the thumbnails + recent order used by the Alt+Tab switcher
[module/workspaces]
type = custom/script
exec = ~/Desktop/dotfiles/Polybar/pixel/scripts/workspaces.py
tail = true
format = <label>
label = %output%

; ---------- clock -> calendar popup ----------
[module/date]
type = internal/date
interval = 1
time = %H:%M
format = %{A1:~/Desktop/dotfiles/Polybar/pixel/scripts/pixelpop.py calendar &:}<label>%{A}
label = %time%

; ---------- cpu / ram bars -> system info popup ----------
[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 85
format = %{A1:~/Desktop/dotfiles/Polybar/pixel/scripts/pixelpop.py sysinfo &:}<ramp-load> <label> <bar-load>%{A}
format-warn = %{A1:~/Desktop/dotfiles/Polybar/pixel/scripts/pixelpop.py sysinfo &:}<ramp-load> <label-warn> <bar-load>%{A}
label = %percentage:2%%
label-warn = %percentage:2%%
; the "CPU" tag: primary, alert from warn-percentage (85) up (weights 85 + 15)
ramp-load-0 = CPU
ramp-load-0-foreground = ${colors.primary}
ramp-load-0-weight = 85
ramp-load-1 = CPU
ramp-load-1-foreground = ${colors.alert}
ramp-load-1-weight = 15

bar-load-width = 6
bar-load-indicator =
bar-load-fill = █
bar-load-fill-foreground = ${colors.primary}
bar-load-empty = ░
bar-load-empty-foreground = ${colors.border}

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 90
format = %{A1:~/Desktop/dotfiles/Polybar/pixel/scripts/pixelpop.py sysinfo &:}<ramp-used> <label> <bar-used>%{A}
format-warn = %{A1:~/Desktop/dotfiles/Polybar/pixel/scripts/pixelpop.py sysinfo &:}<ramp-used> <label-warn> <bar-used>%{A}
label = %percentage_used:2%%
label-warn = %percentage_used:2%%
; the "RAM" tag: primary, alert from warn-percentage (90) up (weights 90 + 10)
ramp-used-0 = RAM
ramp-used-0-foreground = ${colors.primary}
ramp-used-0-weight = 90
ramp-used-1 = RAM
ramp-used-1-foreground = ${colors.alert}
ramp-used-1-weight = 10

bar-used-width = 6
bar-used-indicator =
bar-used-fill = █
bar-used-fill-foreground = ${colors.primary}
bar-used-empty = ░
bar-used-empty-foreground = ${colors.border}

; ---------- network -> network switcher popup ----------
[module/network]
type = custom/script
exec = ~/Desktop/dotfiles/Polybar/pixel/scripts/network_speed_icon.sh
tail = true
click-left = ~/Desktop/dotfiles/Polybar/pixel/scripts/pixelpop.py network &
click-right = ~/Desktop/dotfiles/Polybar/pixel/scripts/network_final.sh toggle

; ---------- volume -> volume slider popup ----------
[module/pulseaudio]
type = internal/pulseaudio

format-volume = %{A1:~/Desktop/dotfiles/Polybar/pixel/scripts/pixelpop.py volume &:}<ramp-volume> <label-volume>%{A}
format-muted = %{A1:~/Desktop/dotfiles/Polybar/pixel/scripts/pixelpop.py volume &:}<ramp-volume> <label-muted>%{A}

; the "VOL" tag
ramp-volume-0 = VOL
ramp-volume-foreground = ${colors.primary}

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

; ---------- battery -> power & battery popup ----------
[module/battery]
type = internal/battery
battery = BAT1
adapter = AC
poll-interval = 5
low-at = 15

format-charging = %{A1:~/Desktop/dotfiles/Polybar/pixel/scripts/pixelpop.py power &:}<animation-charging> <label-charging>%{A}
label-charging = %percentage%%

format-discharging = %{A1:~/Desktop/dotfiles/Polybar/pixel/scripts/pixelpop.py power &:}<ramp-capacity> <label-discharging>%{A}
label-discharging = %percentage%%

format-full = %{A1:~/Desktop/dotfiles/Polybar/pixel/scripts/pixelpop.py power &:}<ramp-capacity> <label-full>%{A}
label-full = full

format-low = %{A1:~/Desktop/dotfiles/Polybar/pixel/scripts/pixelpop.py power &:}<ramp-capacity> <label-low>%{A}
label-low = %percentage%%
label-low-foreground = ${colors.alert}

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁽
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
ramp-capacity-foreground = ${colors.primary}

animation-charging-0 = 󰢜
animation-charging-1 = 󰂇
animation-charging-2 = 󰢝
animation-charging-3 = 󰂅
animation-charging-foreground = ${colors.primary}
animation-charging-framerate = 600

; ---------- power button -> session popup ----------
[module/session]
type = custom/text
format = %{A1:~/Desktop/dotfiles/Polybar/pixel/scripts/pixelpop.py session &:}󰐥%{A}
format-foreground = ${colors.alert}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
